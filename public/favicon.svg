<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fundo escuro arredondado -->
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  
  <!-- Letra V em roxo com gradiente sutil -->
  <path 
    d="M16 18 L32 46 L48 18" 
    stroke="url(#v-gradient)" 
    stroke-width="8" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Detalhe de código "</>" pequeno no canto -->
  <path 
    d="M42 40 L46 44 L42 48 M50 40 L46 44 L50 48" 
    stroke="#a855f7" 
    stroke-width="2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    opacity="0.7"
  />
  
  <defs>
    <linearGradient id="v-gradient" x1="16" y1="18" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
</svg>